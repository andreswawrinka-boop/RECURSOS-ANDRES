<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notas Anestesiología · Dr. Robayo</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B0F2E; --ink2:#1B2160; --paper:#FFFFFF;
  --yel:#FFC400; --blue:#1E40FF; --green:#00A152; --red:#E00000;
  --orange:#FF6D00; --purple:#6200EA; --teal:#00897B; --magenta:#C51162; --uc:#1E40FF;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:14px}
button,input,select{font:inherit;color:inherit}

/* ── BARRA SUPERIOR ── */
.top{display:flex;align-items:center;gap:8px;padding:10px 18px;background:var(--ink);color:#fff;
  border-bottom:4px solid var(--yel);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.3px;margin-right:auto;line-height:1.15}
.brand small{display:block;font-size:11px;color:var(--yel);font-weight:600;letter-spacing:.3px}
.status{font-size:12px;font-weight:700;padding:6px 10px;border-radius:6px;color:#fff}
.status.ok{background:var(--green)} .status.dirty{background:var(--orange)}
.btn{border:2px solid var(--ink);background:#fff;color:var(--ink);padding:7px 12px;border-radius:7px;
  font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;transition:transform .1s}
.btn:hover{background:var(--yel);border-color:var(--yel);color:var(--ink)}
.btn:active{transform:translateY(1px)}
.top .btn{border-color:#fff}
.btn.pri{background:var(--yel);border-color:var(--yel)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.red{border-color:var(--red);color:var(--red)}
.btn.red:hover{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}

/* ── LAYOUT ── */
.app{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 64px)}
.side{background:var(--ink);color:#fff;padding:14px 12px;border-right:4px solid var(--yel)}
.side h3{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--yel);margin:2px 6px 10px}
.fold{margin-bottom:7px;border-radius:8px;overflow:hidden;border:2px solid var(--ink2)}
.fold-h{display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer;background:var(--ink2);font-weight:700;user-select:none}
.fold-h .dot{width:12px;height:12px;border-radius:3px;background:var(--uc);flex:none}
.fold-h .cnt{margin-left:auto;font-size:11px;background:var(--uc);padding:2px 8px;border-radius:10px;white-space:nowrap}
.fold-h .car{font-size:10px;transition:transform .15s;color:var(--yel)}
.fold.open .car{transform:rotate(90deg)}
.fold-b{display:none;padding:6px}
.fold.open .fold-b{display:block}
.sem{font-size:10.5px;font-weight:700;color:var(--yel);letter-spacing:.9px;margin:8px 6px 4px}
.rot{display:block;width:100%;text-align:left;background:transparent;border:2px solid transparent;color:#fff;
  padding:6px 9px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
.rot:hover{border-color:var(--uc)}
.rot.on{background:var(--uc);border-color:var(--uc)}
.rot small{display:block;font-size:11px;font-weight:500;color:var(--yel)}
.rot.on small{color:#fff}
.add-rot{margin-top:6px;width:100%;border:2px dashed var(--uc);background:transparent;color:#fff;padding:6px;
  border-radius:6px;cursor:pointer;font-weight:700;font-size:12px}
.add-rot:hover{background:var(--uc)}
.empty-f{font-size:12px;padding:4px 8px;color:var(--yel)}
.main{padding:18px 22px;min-width:0}

/* ── RESUMEN GENERAL ── */
.ov h2{font-size:24px;letter-spacing:-.5px;margin-bottom:4px}
.ov p.lead{font-size:13.5px;margin-bottom:16px;max-width:760px}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ov-card{border:3px solid var(--uc);border-radius:10px;overflow:hidden}
.ov-card h4{background:var(--uc);color:#fff;padding:8px 12px;font-size:14px}
.ov-card .b{padding:10px 12px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.ov-card .n{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;line-height:1}
.ov-card .l{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.ov-card .add-rot{color:var(--ink);margin:0 12px 12px;width:calc(100% - 24px)}
.ov-card .add-rot:hover{color:#fff}
.howto{margin-top:18px;border:3px solid var(--ink);border-radius:10px;padding:12px 16px;font-size:13px;line-height:1.55}
.howto b{color:var(--blue)}

/* ── CABECERA DE ROTACIÓN ── */
.rhead{background:var(--uc);color:#fff;border-radius:10px 10px 0 0;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rhead h2{font-size:19px;letter-spacing:-.3px;margin-right:4px}
.chip{background:var(--ink);color:#fff;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:6px;white-space:nowrap}
.chip.y{background:var(--yel);color:var(--ink)}
.dates{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dates label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:5px}
.dates input{border:2px solid #fff;border-radius:6px;padding:4px 6px;font-weight:700;font-size:13px;color:var(--ink);background:#fff}
.racts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.rhead .btn{border-color:#fff}

.cfg{border:3px solid var(--uc);border-top:0;padding:10px 14px;display:flex;flex-direction:column;gap:10px}
.cfg-row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;min-width:96px;line-height:1.25}
.lbl small{display:block;text-transform:none;letter-spacing:0;font-weight:600;color:var(--blue)}
.tchip{display:flex;align-items:center;gap:4px;border:2px solid var(--blue);border-radius:18px;padding:2px 3px 2px 10px}
.tchip input{border:0;background:transparent;font-weight:600;font-size:12.5px;min-width:70px}
.tchip input:focus{outline:none}
.x{border:0;background:var(--red);color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-weight:700;line-height:1;flex:none}
.seg{display:flex;border:2px solid var(--orange);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;font-weight:700;font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--orange);color:#fff}

/* ── TABLAS ── */
.tw{border:3px solid var(--uc);border-top:0;overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{background:var(--ink);color:#fff;font-size:11.5px;font-weight:700;padding:6px 6px;border:1px solid var(--ink);line-height:1.2;vertical-align:bottom}
th small{display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;margin-top:2px;font-weight:500}
th.t{background:var(--blue)} th.p{background:var(--orange)} th.e{background:var(--red)}
th.n{background:var(--purple);min-width:84px} th.pr{background:var(--green)} th.co{background:var(--teal)}
th.ae{background:var(--magenta)} th.f{background:var(--ink);border-left:4px solid var(--yel);min-width:96px}
td{border:1px solid var(--ink);padding:4px 5px;text-align:center}
td.idx{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;width:34px}
td.sep{border-left:4px solid var(--yel)}
.nm{width:100%;min-width:190px;border:2px solid var(--ink);border-radius:5px;padding:5px 7px;font-weight:600}
.g{width:64px;border:2px solid var(--blue);border-radius:5px;padding:5px 4px;text-align:center;
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px}
.g.k-practica{border-color:var(--green)} .g.k-conductual{border-color:var(--teal)}
.g.k-autoevaluacion{border-color:var(--magenta)} .g.k-par{border-color:var(--orange)} .g.k-ex{border-color:var(--red)}
.nm:focus,.g:focus{outline:none;border-color:var(--yel);box-shadow:0 0 0 3px var(--yel)}
.g.bad{border-color:var(--red);color:var(--red);border-style:dashed}
.res{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:17px}
.res.big{font-size:19px}
.res.pass{color:var(--green)} .res.fail{color:var(--red)}
.inc{display:block;font-size:10px;font-weight:700;color:var(--orange)}
.na{font-size:11px;font-weight:700;color:var(--ink2)}

/* Formato de nota final por universidad */
.fmt{border:3px solid var(--uc);border-top:0;border-radius:0 0 10px 10px;padding:12px 14px}
.fmt h3{font-size:15px;margin-bottom:3px;color:var(--purple)}
.fmt .rule{font-size:12px;font-weight:600;margin-bottom:8px}
.fmt td{font-family:'JetBrains Mono',monospace;font-size:13px}
.fmt td.name{font-family:'Space Grotesk',sans-serif;text-align:left;font-weight:700}
.fmt td .op{display:block;font-size:10.5px;color:var(--ink2);font-weight:500}
.fmt td b{font-size:14px}
.fmt th{background:var(--uc)}
.fmt th.f{background:var(--red);border-left:1px solid var(--ink)}
.fmt.none{font-size:12.5px;font-weight:700}

.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stat{border:2px solid var(--ink);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700}
.stat span{font-family:'JetBrains Mono',monospace;font-size:16px;margin-left:6px}
.stat.g1{border-color:var(--green)} .stat.g1 span{color:var(--green)}
.stat.r1{border-color:var(--red)} .stat.r1 span{color:var(--red)}
.hint{font-size:11.5px;margin-top:8px;font-weight:600}

/* ── DIÁLOGO ── */
dialog{border:3px solid var(--ink);border-radius:12px;padding:0;width:min(420px,94vw)}
dialog::backdrop{background:rgba(11,15,46,.65)}
dialog form{padding:18px}
dialog h2{font-size:19px;margin-bottom:12px;border-bottom:4px solid var(--yel);padding-bottom:6px}
dialog label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
dialog input,dialog select{display:block;width:100%;margin-top:4px;border:2px solid var(--ink);border-radius:6px;padding:7px;font-size:14px;font-weight:600;text-transform:none;letter-spacing:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#n-info{font-size:12.5px;font-weight:700;color:var(--blue);margin-bottom:12px;min-height:18px}
.dlg-act{display:flex;justify-content:flex-end;gap:8px}

#print{display:none}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:4px solid var(--yel)}
  .main{padding:14px 10px}
  .racts{margin-left:0}
}

/* ── IMPRESIÓN (reporte estático) ── */
@media print{
  @page{margin:8mm}
  .top,.app,dialog{display:none!important}
  body{background:#fff}
  #print{display:block;font-size:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print h1{font-size:20px;border-bottom:4px solid var(--uc);padding-bottom:4px;margin-bottom:4px}
  #print h2{font-size:15px;margin:14px 0 4px;color:var(--purple)}
  #print .meta{font-size:12px;font-weight:600;margin-bottom:10px}
  #print table{width:100%;table-layout:auto}
  #print th{font-size:10.5px;padding:5px 4px}
  #print td{font-size:13px;padding:6px 4px;font-family:'JetBrains Mono',monospace}
  #print td.name{font-family:'Space Grotesk',sans-serif;text-align:left;font-weight:600}
  #print .fmt{border:0;padding:0}
  #print .foot{margin-top:12px;font-size:11px;font-weight:600}

  /* Reporte consolidado (todas las universidades) */
  @page{size:letter portrait;margin:9mm}
  #print.rep{font-size:10px}
  #print.rep .rt{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:4px solid var(--yel);padding-bottom:5px;margin-bottom:7px}
  #print.rep h1{font-size:18px;border:0;padding:0;margin:0}
  #print.rep .meta{margin:0;font-size:10px}
  #print.rep .kp{font-size:9px;font-weight:700;text-transform:uppercase;white-space:nowrap}
  #print.rep .kp b{font-family:'JetBrains Mono',monospace;font-size:16px;margin:0 3px 0 10px}
  #print.rep th{font-size:8.5px;padding:3px 3px;line-height:1.1}
  #print.rep th small{font-size:8px;margin-top:1px}
  #print.rep td{font-size:10px;padding:2.5px 4px}
  #print.rep .l{text-align:left}
  #print.rep td.l{font-family:'Space Grotesk',sans-serif;font-weight:600}
  #print.rep td.b{font-weight:700}
  #print.rep .ok{color:var(--green);font-weight:700}
  #print.rep .no{color:var(--red);font-weight:700}
  #print.rep td.pend{color:var(--orange);font-weight:700}
  #print.rep td.st{font-family:'Space Grotesk',sans-serif;font-size:9px;text-transform:uppercase}
  #print.rep .sum{margin-bottom:8px}
  #print.rep .sum td{font-family:'JetBrains Mono',monospace}
  #print.rep .sum i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  #print.rep .rs h2{background:var(--uc);color:#fff;font-size:12.5px;padding:4px 8px;margin:10px 0 4px;border-radius:4px;break-after:avoid}
  #print.rep .rs h2 span{font-size:9px;font-weight:600;margin-left:8px}
  #print.rep .rb{break-inside:avoid;margin-bottom:6px}
  #print.rep .rh{font-size:10px;font-weight:700;border-left:4px solid var(--uc);padding-left:6px;margin-bottom:2px}
  #print.rep .rh span{font-weight:500;margin-left:8px}
  #print.rep .foot{margin-top:8px;font-size:9px}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">Notas · Anestesiología<small>Dr. Andrés Robayo · Subred Suroccidente · Bogotá</small></div>
  <span id="status" class="status ok">✓ Sin cambios pendientes</span>
  <button class="btn" onclick="document.getElementById('imp').click()">⬆ Importar JSON</button>
  <button class="btn pri" onclick="exportarJSON()">⬇ Exportar JSON (todo)</button>
  <button class="btn green" onclick="imprimirTodo()">🖨 Notas de todos (PDF)</button>
  <input type="file" id="imp" accept=".json,application/json" hidden onchange="importarJSON(event)">
</header>

<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>

<div id="print"></div>

<dialog id="dlg">
  <form id="fnew">
    <h2>Nueva rotación</h2>
    <label>Universidad<select id="n-uni"></select></label>
    <div class="two">
      <label>Inicio<input type="date" id="n-ini" required></label>
      <label>Fin<input type="date" id="n-fin" required></label>
    </div>
    <label>Número de estudiantes<input type="number" id="n-est" min="1" max="40" value="2"></label>
    <div id="n-info"></div>
    <div class="dlg-act">
      <button type="button" class="btn" onclick="dlg.close()">Cancelar</button>
      <button type="submit" class="btn pri">Crear rotación</button>
    </div>
  </form>
</dialog>

<script>
// ══════════════════════════════════════════════════
// CONFIGURACIÓN
// NOTA TEÓRICA (todas las universidades):
//   1–3 semanas: Promedio de talleres 30% + Examen final 70%
//   4–6 semanas: Promedio de talleres 30% + Parcial 30% + Examen final 40%
// NOTA FINAL: formato propio de cada universidad (teórica + práctica + conductual).
// ══════════════════════════════════════════════════
const PLAN = ['Vía Aérea y Ventilador','Farmacología Anestésica 1','Dolor y Anestésicos Locales',
              'Farmacología Anestésica 2','Líquidos y NVPO','Valoración Preanestésica'];
const UNIS = [
  {key:'bosque',  label:'Universidad El Bosque',            short:'El Bosque',  color:'#00A152', est:2,
   formato:{tipo:'bosque', titulo:'Nota final El Bosque (sobre 50 puntos)',
            regla:'Historia clínica 10 pts (teórica ×2) + responsabilidad 10 pts (conductual ×2) + práctica 20 pts (práctica ×4) + conocimientos 10 pts (teórica ×2)'}},
  {key:'sabana',  label:'Universidad de La Sabana',         short:'La Sabana',  color:'#00838F', est:4,
   formato:{tipo:'sabana', titulo:'Nota final La Sabana (sobre 5.0)',
            regla:'40% teórica + 60% del promedio entre práctica y conductual'}},
  {key:'martin',  label:'Universidad de San Martín',        short:'San Martín', color:'#6200EA', est:2,
   formato:{tipo:'pct', titulo:'Nota final San Martín (sobre 5.0)', regla:'40% teórica + 45% práctica + 15% conductual',
            comp:[['Teórica','T',40],['Práctica','P',45],['Conductual','C',15]]}},
  {key:'rosario', label:'Universidad del Rosario',          short:'Rosario',    color:'#1E40FF', est:1,
   formato:{tipo:'rosario', titulo:'Nota final Universidad del Rosario (sobre 5.0)',
            regla:'80%: los 7 componentes (3 de práctica, 2 de teórica, 2 de conductual) · 20%: autoevaluación'}},
  {key:'narino',  label:'Universidad Antonio Nariño (UAN)', short:'UAN',        color:'#FF6D00', est:2,
   formato:{tipo:'uan', titulo:'Nota final UAN (sobre 50 puntos)', regla:'Teórica ×4 (20 pts) + práctica ×4 (20 pts) + conductual ×2 (10 pts)'}},
  {key:'udca',    label:'UDCA',                             short:'UDCA',       color:'#E00000', est:2,
   formato:{tipo:'pct', titulo:'Nota final UDCA (sobre 5.0)', regla:'40% teórica + 50% práctica + 10% conductual',
            comp:[['Teórica','T',40],['Práctica','P',50],['Conductual','C',10]]}},
];
const ROSARIO = [
  ['Elaboración de la historia clínica','P'],['Examen físico','P'],['Habilidades de diagnóstico','P'],
  ['Conocimientos científicos','T'],['Habilidades de comunicación interpersonal','T'],
  ['Profesionalismo','C'],['Iniciativa y deseo por aprender','C']];
const FUENTE = {T:'Nota teórica',P:'Nota práctica',C:'Nota conductual'};
// Nota mínima aprobatoria (sobre 5.0): 3.0 para todas, 3.5 para La Sabana. UAN: 30/50.
const MIN = k => k==='sabana' ? 3.5 : 3;
const PESO_T = 30;
const LS_KEY = 'notas-anestesia-v3';

// DATA[universidad][idRotación] = {inicio, fin, etiqueta, talleres:[nombre], examenes:1|2,
//   estudiantes:[{nombre, tal, par, ex, practica, conductual, autoevaluacion}]}
let DATA = {}, SEL = {u:'', r:''}, OPEN = {}, DIRTY = false;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const hoyISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function fmtF(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${+d} ${MES[+m-1]} ${y}`; }
function semanas(a,b){
  if(!a||!b) return null;
  const dias = Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/86400000)+1;
  return dias>0 ? Math.min(6, Math.max(1, Math.ceil(dias/7))) : null;
}
function semestre(iso){ if(!iso) return 'Sin fecha'; const [y,m]=iso.split('-'); return `${y}-${+m<=6?1:2}`; }
const uniBy = k => UNIS.find(u => u.key===k);
const rot = () => (SEL.u && SEL.r && DATA[SEL.u]) ? DATA[SEL.u][SEL.r] || null : null;
const pesos = r => r.examenes===2 ? {par:30, ex:40} : {par:0, ex:70};
const rotLabel = r => (r.inicio && r.fin) ? `${fmtF(r.inicio)} → ${fmtF(r.fin)}` : (r.etiqueta || 'Rotación sin fechas');
const num = (n,d=2) => n===null||n===undefined ? '' : n.toFixed(d).replace('.',',');
const f2 = n => n===null||n===undefined ? '—' : n.toFixed(2);
function val(v){
  if(v===''||v==null) return null;
  const n = parseFloat(String(v).replace(',','.'));
  return Number.isFinite(n) && n>=0 && n<=5 ? n : null;
}
const nuevoEst = () => ({nombre:'', tal:'', par:'', ex:'', practica:'', conductual:'', autoevaluacion:''});
const nuevoId = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);

// ── NOTA TEÓRICA ──
// Promedio ponderado de lo ya ingresado (se normaliza mientras se llena).
function calc(st, r){
  const P=pesos(r); let s=0, w=0, faltan=0;
  const add=(v,p)=>{ const x=val(v); if(x!==null){ s+=x*p; w+=p; } else faltan++; };
  add(st.tal, PESO_T);
  if(P.par) add(st.par, P.par);
  add(st.ex, P.ex);
  return {nota: w ? s/w : null, completa: faltan===0, faltan};
}

// ── NOTA FINAL SEGÚN EL FORMATO DE CADA UNIVERSIDAD ──
// Se calcula cuando están todos los componentes que pide el formato.
function notaFinal(ukey, st, r){
  const fm=uniBy(ukey).formato; if(!fm) return null;
  const nf=notaFinalBase(fm,st,r);
  nf.min = es50(fm) ? 30 : MIN(ukey);
  return nf;
}
function notaFinalBase(fm, st, r){
  const T=calc(st,r).nota, P=val(st.practica), C=val(st.conductual), AE=val(st.autoevaluacion);
  if(T===null||P===null||C===null) return {val:null, escala:es50(fm)?50:5};
  if(fm.tipo==='pct'){ const V={T,P,C}; return {val:fm.comp.reduce((s,[,k,p])=>s+V[k]*p/100,0), escala:5}; }
  if(fm.tipo==='sabana') return {val:T*0.40+((P+C)/2)*0.60, escala:5};
  if(fm.tipo==='bosque') return {val:T*2+C*2+P*4+T*2, escala:50};
  if(fm.tipo=='uan') return {val:T*4+P*4+C*2, escala:50};
  if(fm.tipo==='rosario'){ if(AE===null) return {val:null,escala:5}; return {val:((3*P+2*T+2*C)/7)*0.80+AE*0.20, escala:5}; }
  return null;
}
const aprueba = nf => nf.val>=nf.min;
const es50 = fm => !!fm && (fm.tipo==='uan' || fm.tipo==='bosque');
function finalHTML(nf, big){
  if(!nf) return '<span class="na">No aplica</span>';
  if(nf.val===null) return '<span class="res">—</span>';
  const v = nf.escala===50 ? nf.val.toFixed(1)+'<small style="font-size:11px">/50</small>' : nf.val.toFixed(2);
  return `<span class="res ${big?'big':''} ${aprueba(nf)?'pass':'fail'}">${v}</span>`;
}

function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({data:DATA, sel:SEL, open:OPEN, dirty:DIRTY})); }catch(e){} }
function touch(){ DIRTY=true; status(); clearTimeout(touch.t); touch.t=setTimeout(persist,250); }
function status(){
  const el=$('#status');
  el.className='status '+(DIRTY?'dirty':'ok');
  el.textContent = DIRTY ? '● Cambios sin exportar' : '✓ Sin cambios pendientes';
}
function load(){
  try{
    const o = JSON.parse(localStorage.getItem(LS_KEY)||'null');
    if(o && o.data){ DATA=o.data; SEL=o.sel||SEL; OPEN=o.open||{}; DIRTY=!!o.dirty; }
  }catch(e){}
  Object.keys(DATA).forEach(u=>Object.keys(DATA[u]||{}).forEach(id=>normRot(DATA[u][id])));
}
window.addEventListener('beforeunload', e=>{ persist(); if(DIRTY){ e.preventDefault(); e.returnValue=''; } });

function idsOrdenados(u){
  const recs=DATA[u]||{};
  return Object.keys(recs).sort((a,b)=>String(recs[b].inicio||'').localeCompare(String(recs[a].inicio||'')));
}
function renderSide(){
  let h='<h3>Universidades · rotaciones</h3>';
  UNIS.forEach(u=>{
    const recs=DATA[u.key]||{}, ids=idsOrdenados(u.key);
    const nEst=ids.reduce((s,id)=>s+recs[id].estudiantes.length,0);
    let b='', last=null;
    ids.forEach(id=>{
      const r=recs[id], sm=semestre(r.inicio);
      if(sm!==last){ b+=`<div class="sem">${sm==='Sin fecha'?'SIN FECHA':'PERIODO '+sm}</div>`; last=sm; }
      const n=r.estudiantes.length, s=semanas(r.inicio,r.fin);
      b+=`<button class="rot ${SEL.u===u.key&&SEL.r===id?'on':''}" data-go="${u.key}|${id}">${esc(rotLabel(r))}
          <small>${n} estudiante${n===1?'':'s'}${s?' · '+s+' sem':''}</small></button>`;
    });
    if(!ids.length) b+='<div class="empty-f">Sin rotaciones todavía</div>';
    b+=`<button class="add-rot" data-new="${u.key}">+ Nueva rotación</button>`;
    h+=`<div class="fold ${OPEN[u.key]?'open':''}" style="--uc:${u.color}">
          <div class="fold-h" data-fold="${u.key}"><span class="car">▶</span><span class="dot"></span>${u.short}
            <span class="cnt">${ids.length} rot · ${nEst} est</span></div>
          <div class="fold-b">${b}</div></div>`;
  });
  $('#side').innerHTML=h;
}

function renderOverview(){
  let cards='';
  UNIS.forEach(u=>{
    const recs=DATA[u.key]||{}, ids=Object.keys(recs);
    let nEst=0, ap=0, rp=0;
    ids.forEach(id=>recs[id].estudiantes.forEach(st=>{
      nEst++;
      const nf=notaFinal(u.key,st,recs[id]);
      const ok = nf ? (nf.val===null?null:aprueba(nf)) : (()=>{ const c=calc(st,recs[id]); return c.nota===null?null:c.nota>=MIN(u.key); })();
      if(ok===true) ap++; else if(ok===false) rp++;
    }));
    cards+=`<div class="ov-card" style="--uc:${u.color}"><h4>${u.label}</h4>
      <div class="b"><div><div class="n">${ids.length}</div><div class="l">Rotaciones</div></div>
      <div><div class="n">${nEst}</div><div class="l">Estudiantes</div></div>
      <div><div class="n" style="color:var(--green)">${ap}</div><div class="l">Aprueban</div></div>
      <div><div class="n" style="color:var(--red)">${rp}</div><div class="l">Reprueban</div></div></div>
      <button class="add-rot" data-new="${u.key}">+ Nueva rotación</button></div>`;
  });
  $('#main').innerHTML=`<div class="ov">
    <h2>Semestre completo · todas las universidades</h2>
    <p class="lead">Abra una carpeta a la izquierda para ver sus rotaciones, o cree una nueva. Todo queda en un solo archivo JSON que se va alimentando grupo a grupo.</p>
    <div class="ov-grid">${cards}</div>
    <div class="howto">
      <b>1.</b> Al iniciar la sesión: <b>Importar JSON</b> (el archivo del semestre).<br>
      <b>2.</b> Cree la rotación en la carpeta de la universidad (fechas → talleres y exámenes automáticos).<br>
      <b>3.</b> Digite: promedio de talleres, exámenes, práctica y conductual. <b>Enter</b> o <b>↓ ↑</b> pasan al siguiente estudiante; acepta 3,8 o 3.8.<br>
      <b>4.</b> Al terminar: <b>Exportar JSON (todo)</b> — incluye todas las universidades y rotaciones.<br>
      Los cambios también se guardan solos en este navegador; el JSON es el respaldo oficial.
    </div></div>`;
}

function outHTML(st,r){
  const c=calc(st,r);
  if(c.nota===null) return '<span class="res">—</span>';
  return `<span class="res ${c.nota>=MIN(SEL.u)?'pass':'fail'}">${c.nota.toFixed(2)}</span>${c.completa?'':`<span class="inc">faltan ${c.faltan}</span>`}`;
}
function statsHTML(r){
  const fm=uniBy(SEL.u).formato;
  let nT=0,sT=0,nF=0,sF=0,ap=0,rp=0;
  r.estudiantes.forEach(st=>{
    const c=calc(st,r); if(c.nota!==null){ nT++; sT+=c.nota; }
    if(fm){ const nf=notaFinal(SEL.u,st,r); if(nf.val!==null){ nF++; sF+=nf.val; aprueba(nf)?ap++:rp++; } }
    else if(c.nota!==null){ c.nota>=MIN(SEL.u)?ap++:rp++; }
  });
  const esc50 = fm && es50(fm);
  return `<div class="stat">Promedio teórica<span>${nT?(sT/nT).toFixed(2):'—'}</span></div>
    ${fm?`<div class="stat">Promedio nota final<span>${nF?(sF/nF).toFixed(esc50?1:2):'—'}</span></div>`:''}
    <div class="stat g1">Aprueban<span>${ap}</span></div>
    <div class="stat r1">Reprueban<span>${rp}</span></div>`;
}
const gIn = (k,i,v) => `<input class="g k-${k} ${String(v??'').trim()!==''&&val(v)===null?'bad':''}" inputmode="decimal" autocomplete="off"
  data-k="${k}" data-i="${i}" value="${esc(v)}" placeholder="—">`;

// Tabla con el formato de nota final de la universidad (para copiar al formato oficial)
function formatoHTML(ukey, r, imprimir){
  const fm=uniBy(ukey).formato;
  if(!fm) return imprimir ? '' : `<div class="fmt none">El Bosque no tiene un formato de nota final en esta herramienta: se registran la nota teórica, la práctica y la conductual.</div>`;
  let th='<th style="text-align:left">Estudiante</th>';
  if(fm.tipo==='pct') fm.comp.forEach(([l,,p])=>{ th+=`<th>${l}<small>${p}%</small></th>`; });
  if(fm.tipo==='sabana') th+='<th>Teórica<small>40%</small></th><th>Práctica + Conductual<small>60% del promedio</small></th>';
  if(fm.tipo==='bosque') th+='<th>Historia clínica<small>teórica ×2 · 10 pts</small></th><th>Responsabilidad<small>conductual ×2 · 10 pts</small></th><th>Práctica<small>×4 · 20 pts</small></th><th>Conocimientos<small>teórica ×2 · 10 pts</small></th>';
  if(fm.tipo=='uan') th+='<th>Teórica<small>×4 · 20 pts</small></th><th>Práctica<small>×4 · 20 pts</small></th><th>Conductual<small>×2 · 10 pts</small></th>';
  if(fm.tipo==='rosario'){ ROSARIO.forEach(([l,k])=>{ th+=`<th>${l}<small>${FUENTE[k]}</small></th>`; }); th+='<th>Autoevaluación<small>20%</small></th>'; }
  th+=`<th class="f">NOTA FINAL<small>${es50(fm)?'sobre 50':'sobre 5.0'}</small></th>`;

  const rows=r.estudiantes.map((st,i)=>{
    const T=calc(st,r).nota, P=val(st.practica), C=val(st.conductual), AE=val(st.autoevaluacion), V={T,P,C};
    let td=`<td class="name">${esc(st.nombre||'Estudiante '+(i+1))}</td>`;
    if(fm.tipo==='pct') fm.comp.forEach(([,k,p])=>{ td+=`<td><span class="op">${f2(V[k])} × ${p}%</span><b>${V[k]===null?'—':(V[k]*p/100).toFixed(3)}</b></td>`; });
    if(fm.tipo==='sabana'){
      const prom=P!==null&&C!==null?(P+C)/2:null;
      td+=`<td><span class="op">${f2(T)} × 40%</span><b>${T===null?'—':(T*0.4).toFixed(3)}</b></td>`;
      td+=`<td><span class="op">prom(${f2(P)}, ${f2(C)}) × 60%</span><b>${prom===null?'—':(prom*0.6).toFixed(3)}</b></td>`;
    }
    if(fm.tipo==='bosque') [[T,2],[C,2],[P,4],[T,2]].forEach(([x,m])=>{ td+=`<td><span class="op">${f2(x)} × ${m}</span><b>${x===null?'—':(x*m).toFixed(1)+' pts'}</b></td>`; });
    if(fm.tipo=='uan') [[T,4],[P,4],[C,2]].forEach(([x,m])=>{ td+=`<td><span class="op">${f2(x)} × ${m}</span><b>${x===null?'—':(x*m).toFixed(1)+' pts'}</b></td>`; });
    if(fm.tipo==='rosario'){ ROSARIO.forEach(([,k])=>{ td+=`<td><b>${f2(V[k])}</b></td>`; }); td+=`<td><b>${f2(AE)}</b></td>`; }
    td+=`<td>${finalHTML(notaFinal(ukey,st,r),true)}</td>`;
    return `<tr>${td}</tr>`;
  }).join('');
  return `<div class="fmt"><h3>📋 ${fm.titulo}</h3><div class="rule">${fm.regla} · mínimo aprobatorio ${es50(fm)?'30/50':MIN(ukey).toFixed(1)} — para copiar directamente al formato de calificación</div>
    <div style="overflow-x:auto"><table><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function renderMain(){
  const r=rot();
  if(!r){ renderOverview(); return; }
  const u=uniBy(SEL.u), P=pesos(r), nT=r.talleres.length, fm=u.formato, ros=fm&&fm.tipo==='rosario';
  const s=semanas(r.inicio,r.fin);

  const chips=r.talleres.map((t,j)=>`<span class="tchip"><input data-k="tname" data-j="${j}" value="${esc(t)}"
      placeholder="Nombre del taller" size="${Math.max(10,t.length)}"><button class="x" title="Quitar taller" data-a="delt" data-j="${j}">×</button></span>`).join('');

  let th=`<th>#</th><th style="text-align:left">Estudiante</th>
    <th class="t">Talleres<small>promedio · 30%</small></th>`;
  if(P.par) th+=`<th class="p">Parcial<small>30%</small></th>`;
  th+=`<th class="e">Examen final<small>${P.ex}%</small></th><th class="n">Nota teórica<small>automática</small></th>
    <th class="pr">Práctica<small>/ 5.0</small></th><th class="co">Conductual<small>/ 5.0</small></th>`;
  if(ros) th+=`<th class="ae">Autoevaluación<small>/ 5.0</small></th>`;
  th+=`<th class="f">Nota final<small>${fm?(es50(fm)?'sobre 50':'sobre 5.0'):'—'}</small></th><th></th>`;

  const rows=r.estudiantes.map((st,i)=>{
    let c=`<td class="idx">${i+1}</td><td><input class="nm" data-k="nombre" data-i="${i}" value="${esc(st.nombre)}" placeholder="Nombre completo" autocomplete="off"></td>
      <td>${gIn('tal',i,st.tal)}</td>`;
    if(P.par) c+=`<td>${gIn('par',i,st.par)}</td>`;
    c+=`<td>${gIn('ex',i,st.ex)}</td><td id="o${i}">${outHTML(st,r)}</td>
      <td class="sep">${gIn('practica',i,st.practica)}</td><td>${gIn('conductual',i,st.conductual)}</td>`;
    if(ros) c+=`<td>${gIn('autoevaluacion',i,st.autoevaluacion)}</td>`;
    c+=`<td id="f${i}" class="sep">${finalHTML(notaFinal(SEL.u,st,r))}</td>
        <td><button class="x" title="Quitar estudiante" data-a="delst" data-i="${i}">×</button></td>`;
    return `<tr>${c}</tr>`;
  }).join('');

  $('#main').innerHTML=`<div style="--uc:${u.color}">
    <div class="rhead">
      <h2>${u.short}</h2>
      <span class="chip y">${s?s+' semana'+(s>1?'s':''):'Sin fechas'}</span>
      <span class="chip">Periodo ${semestre(r.inicio)}</span>
      <div class="dates">
        <label>Inicio <input type="date" data-k="ini" value="${r.inicio||''}"></label>
        <label>Fin <input type="date" data-k="fin" value="${r.fin||''}"></label>
      </div>
      <div class="racts">
        <button class="btn sm" data-a="addst">+ Estudiante</button>
        <button class="btn sm" data-a="print">🖨 Imprimir</button>
        <button class="btn sm red" data-a="delrot">Eliminar rotación</button>
      </div>
    </div>
    <div class="cfg">
      <div class="cfg-row"><span class="lbl">Talleres asignados<small>se califica el promedio</small></span>${chips}
        <button class="btn sm blue" data-a="addt">+ Taller</button>
        <button class="btn sm" data-a="rest">↺ Según semanas</button></div>
      <div class="cfg-row"><span class="lbl">Exámenes</span>
        <div class="seg"><button data-ex="1" class="${P.par?'':'on'}">1 examen · Final 70%</button>
        <button data-ex="2" class="${P.par?'on':''}">2 exámenes · Parcial 30% + Final 40%</button></div></div>
    </div>
    <div class="tw"><table><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table></div>
    <div id="fmt">${formatoHTML(SEL.u,r)}</div>
    <div class="stats" id="stats">${statsHTML(r)}</div>
    <div class="hint">Enter o ↓ ↑ para moverse entre estudiantes. Notas de 0 a 5 — los valores fuera de rango se marcan en rojo y no se cuentan. La nota final aparece cuando están todos sus componentes.</div>
  </div>`;
}
function renderAll(){ renderSide(); renderMain(); persist(); }

// Actualiza solo lo calculado (sin redibujar los campos)
let fmtT;
function refrescar(i){
  const r=rot(), st=r.estudiantes[i];
  if(st){ $('#o'+i).innerHTML=outHTML(st,r); $('#f'+i).innerHTML=finalHTML(notaFinal(SEL.u,st,r)); }
  $('#stats').innerHTML=statsHTML(r);
  clearTimeout(fmtT); fmtT=setTimeout(()=>{ const box=$('#fmt'); if(box&&rot()) box.innerHTML=formatoHTML(SEL.u,rot()); },120);
}

// EVENTOS
// ══════════════════════════════════════════════════
const CAMPOS_NOTA=['tal','par','ex','practica','conductual','autoevaluacion'];
$('#main').addEventListener('input', e=>{
  const el=e.target, k=el.dataset.k, r=rot();
  if(!k || !r) return;
  const i=+el.dataset.i, j=+el.dataset.j;
  if(k==='nombre'){ r.estudiantes[i].nombre=el.value; touch(); refrescar(i); }
  else if(CAMPOS_NOTA.includes(k)){
    r.estudiantes[i][k]=el.value;
    el.classList.toggle('bad', el.value.trim()!=='' && val(el.value)===null);
    touch(); refrescar(i);
  }
  else if(k==='tname'){ r.talleres[j]=el.value; touch(); }
});
$('#main').addEventListener('change', e=>{
  const k=e.target.dataset.k;
  if(k==='ini'||k==='fin') cambiarFechas(k, e.target.value);
});
$('#main').addEventListener('keydown', e=>{
  if(!['Enter','ArrowDown','ArrowUp'].includes(e.key)) return;
  const el=e.target; if(!el.matches('.g,.nm')) return;
  const i=+el.dataset.i + (e.key==='ArrowUp'?-1:1);
  const n=document.querySelector(`#main [data-k="${el.dataset.k}"][data-i="${i}"]`);
  e.preventDefault();
  if(n){ n.focus(); n.select(); }
});

document.addEventListener('click', e=>{
  const t=e.target.closest('[data-fold],[data-go],[data-new],[data-a],[data-ex]');
  if(!t) return;
  const r=rot();
  if(t.dataset.fold){ OPEN[t.dataset.fold]=!OPEN[t.dataset.fold]; renderSide(); persist(); return; }
  if(t.dataset.go){ const [u,id]=t.dataset.go.split('|'); SEL={u,r:id}; renderAll(); window.scrollTo(0,0); return; }
  if(t.dataset.new){ abrirNueva(t.dataset.new); return; }
  if(!r) return;
  if(t.dataset.ex){ r.examenes=+t.dataset.ex; touch(); renderMain(); return; }
  const a=t.dataset.a, i=+t.dataset.i, j=+t.dataset.j;
  if(a==='addst'){
    r.estudiantes.push(nuevoEst()); touch(); renderAll();
    const ns=document.querySelectorAll('#main .nm'); ns[ns.length-1]?.focus();
  }
  else if(a==='delst'){
    const st=r.estudiantes[i];
    const tiene=['nombre',...CAMPOS_NOTA].some(k=>String(st[k]??'').trim());
    if(tiene && !confirm(`¿Quitar a "${st.nombre||'Estudiante '+(i+1)}" y sus notas?`)) return;
    r.estudiantes.splice(i,1); touch(); renderAll();
  }
  else if(a==='addt'){
    r.talleres.push(''); touch(); renderMain();
    const ts=document.querySelectorAll('#main .tchip input'); ts[ts.length-1]?.focus();
  }
  else if(a==='delt'){
    r.talleres.splice(j,1); touch(); renderMain();
  }
  else if(a==='rest'){
    const n=semanas(r.inicio,r.fin);
    if(!n){ alert('Escriba primero las fechas de inicio y fin.'); return; }
    r.talleres=PLAN.slice(0,n); touch(); renderMain();
  }
  else if(a==='delrot'){
    if(!confirm(`¿Eliminar la rotación ${uniBy(SEL.u).short} · ${rotLabel(r)} con todas sus notas?`)) return;
    delete DATA[SEL.u][SEL.r]; SEL.r=''; touch(); renderAll();
  }
  else if(a==='print'){ imprimir(); }
});

function cambiarFechas(k,v){
  const r=rot(); if(!r) return;
  const ini=k==='ini'?v:r.inicio, fin=k==='fin'?v:r.fin;
  if(ini && fin && fin<ini){ alert('La fecha de fin no puede ser anterior a la de inicio.'); renderMain(); return; }
  r.inicio=ini; r.fin=fin; if(ini&&fin) r.etiqueta='';
  const n=semanas(ini,fin);
  if(n){
    const exN=n>=4?2:1;
    if((n!==r.talleres.length || exN!==r.examenes) &&
       confirm(`La rotación ahora es de ${n} semana${n>1?'s':''}.\n¿Ajustar a ${n} taller${n>1?'es':''} asignado${n>1?'s':''} y ${exN===2?'2 exámenes (parcial 30% + final 40%)':'1 examen (final 70%)'}?`)){
      r.talleres=PLAN.slice(0,n); r.examenes=exN;
    }
  }
  touch(); renderAll();
}

const dlg=$('#dlg');
$('#n-uni').innerHTML=UNIS.map(u=>`<option value="${u.key}">${u.label}</option>`).join('');
function infoNueva(){
  const n=semanas($('#n-ini').value,$('#n-fin').value);
  $('#n-info').textContent = n ? `${n} semana${n>1?'s':''} → ${n} taller${n>1?'es':''} (promedio 30%) + ${n>=4?'parcial 30% + final 40%':'examen final 70%'}` : '';
}
function abrirNueva(ukey){
  $('#n-uni').value=ukey; $('#n-est').value=uniBy(ukey).est;
  $('#n-ini').value=''; $('#n-fin').value=''; infoNueva();
  dlg.showModal(); $('#n-ini').focus();
}
$('#n-uni').addEventListener('change',()=>{ $('#n-est').value=uniBy($('#n-uni').value).est; });
$('#n-ini').addEventListener('change',infoNueva);
$('#n-fin').addEventListener('change',infoNueva);
$('#fnew').addEventListener('submit', e=>{
  e.preventDefault();
  const u=$('#n-uni').value, ini=$('#n-ini').value, fin=$('#n-fin').value;
  const nE=Math.max(1,Math.min(40,parseInt($('#n-est').value,10)||1));
  if(fin<ini){ alert('La fecha de fin no puede ser anterior a la de inicio.'); return; }
  const recs=DATA[u]=DATA[u]||{};
  const dup=Object.keys(recs).find(id=>recs[id].inicio===ini && recs[id].fin===fin);
  if(dup && !confirm('Ya existe una rotación de esta universidad con esas mismas fechas. ¿Crear otra de todas formas?')){ dlg.close(); SEL={u,r:dup}; OPEN[u]=true; renderAll(); return; }
  const n=semanas(ini,fin)||1, id=nuevoId();
  recs[id]={inicio:ini, fin, etiqueta:'', talleres:PLAN.slice(0,n), examenes:n>=4?2:1,
            estudiantes:Array.from({length:nE},nuevoEst)};
  SEL={u,r:id}; OPEN[u]=true; dlg.close(); touch(); renderAll();
  document.querySelector('#main .nm')?.focus();
});

// ══════════════════════════════════════════════════
// EXPORTAR / IMPORTAR JSON (un solo archivo para todo el semestre)
// ══════════════════════════════════════════════════
function descargar(contenido,tipo,nombre){
  const url=URL.createObjectURL(new Blob([contenido],{type:tipo}));
  const a=document.createElement('a'); a.href=url; a.download=nombre;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function totalRot(){ return UNIS.reduce((s,u)=>s+Object.keys(DATA[u.key]||{}).length,0); }
function exportarJSON(){
  if(!totalRot()){ alert('Todavía no hay rotaciones para exportar.'); return; }
  const payload={tipo:'notas-anestesiologia', version:4, exportadoEn:new Date().toISOString(), data:DATA};
  descargar(JSON.stringify(payload,null,1),'application/json',`Notas Anestesiología - todas las universidades (${fmtF(hoyISO())}).json`);
  DIRTY=false; status(); persist();
}

// Normaliza un estudiante. Si trae notas por taller (versiones anteriores),
// se convierten en una sola nota: el promedio de los talleres calificados.
function normSt(st){
  st=st||{};
  let tal=st.tal;
  if((tal===undefined||tal==='') && Array.isArray(st.t)){
    const v=st.t.map(val).filter(x=>x!==null);
    tal=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2):'';
  }
  return {nombre:st.nombre||'', tal:tal??'', par:st.par??'', ex:st.ex??'',
          practica:st.practica??'', conductual:st.conductual??'', autoevaluacion:st.autoevaluacion??''};
}
function normRot(r){
  r.talleres=(r.talleres||[]).map(t=>typeof t==='string'?t:((t&&t.nombre)||''));
  r.examenes=r.examenes===2?2:1;
  r.inicio=r.inicio||''; r.fin=r.fin||''; r.etiqueta=r.etiqueta||'';
  r.estudiantes=(r.estudiantes||[]).map(normSt);
  return r;
}
// Rotaciones del formato original (notas por índice de taller + práctica, conductual, autoevaluación)
function desdeAnterior(rec){
  const talleres=(rec.talleres||[]).map(t=>typeof t==='string'?t:((t&&t.nombre)||''));
  const s=semanas(rec.inicio,rec.fin);
  const examenes=rec.conParcial!=null ? (rec.conParcial?2:1) : (s&&s>=4?2:1);
  return normRot({inicio:rec.inicio||'', fin:rec.fin||'', etiqueta:rec.etiqueta||'', talleres, examenes,
    estudiantes:(rec.estudiantes||[]).map(st=>{ const n=st.notas||{};
      return {nombre:st.nombre, t:talleres.map((_,j)=>n[j]??''), par:n.par??'', ex:n.ex??'',
              practica:st.practica, conductual:st.conductual, autoevaluacion:st.autoevaluacion}; })});
}
function hashId(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))|0; return 'L'+(h>>>0).toString(36); }

function importarJSON(ev){
  const f=ev.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    ev.target.value='';
    let p; try{ p=JSON.parse(rd.result); }catch(e){ alert('El archivo no es un JSON válido.'); return; }
    const UK=UNIS.map(u=>u.key), entrantes=[];
    if(p && p.tipo==='notas-anestesiologia' && p.version>=3){
      Object.keys(p.data||{}).forEach(u=>{ if(UK.includes(u)) Object.keys(p.data[u]||{}).forEach(id=>entrantes.push([u,id,normRot(p.data[u][id])])); });
    } else {
      const inc=(p && typeof p==='object' && p.data) ? p.data : p;
      if(!inc || typeof inc!=='object'){ alert('Formato no reconocido.'); return; }
      if(Object.keys(inc).every(k=>UK.includes(k))){
        // versión 2: { universidad: { rotación: {...} } }
        Object.keys(inc).forEach(u=>Object.keys(inc[u]||{}).forEach(k=>entrantes.push([u,hashId(u+'|'+k),desdeAnterior(inc[u][k])])));
      } else {
        // versión 1: { hospital: { universidad: { grupo: {...} } } }
        const per=p.semestre?` · Sem ${p.semestre}${p.anio?'-'+p.anio:''}`:'';
        Object.keys(inc).forEach(h=>Object.keys(inc[h]||{}).forEach(u=>{ if(!UK.includes(u)) return;
          Object.keys(inc[h][u]||{}).forEach(g=>{ const rec=inc[h][u][g]; rec.etiqueta=rec.etiqueta||`${g}${per} · ${h}`;
            entrantes.push([u,hashId(u+'|'+h+'|'+g+per),desdeAnterior(rec)]); }); }));
      }
    }
    if(!entrantes.length){ alert('El archivo no contiene rotaciones.'); return; }
    const conflictos=entrantes.filter(([u,id])=>DATA[u]&&DATA[u][id]).length;
    let reemplazar=true;
    if(conflictos) reemplazar=confirm(`${conflictos} rotación(es) del archivo ya existen aquí.\n\nAceptar = usar la versión del archivo.\nCancelar = conservar la versión actual.`);
    let nuevas=0, act=0;
    entrantes.forEach(([u,id,r])=>{
      DATA[u]=DATA[u]||{};
      if(DATA[u][id]){ if(reemplazar){ DATA[u][id]=r; act++; } }
      else { DATA[u][id]=r; nuevas++; }
      OPEN[u]=true;
    });
    if(nuevas||act) touch();
    // Si lo cargado es exactamente el archivo del semestre, no hay nada pendiente por exportar
    if(p && p.tipo==='notas-anestesiologia' && totalRot()===entrantes.length && nuevas+act===entrantes.length){ DIRTY=false; status(); persist(); }
    renderAll();
    alert(`Importación lista: ${nuevas} rotación(es) nueva(s)${act?`, ${act} actualizada(s)`:''}.`);
  };
  rd.readAsText(f);
}

// ══════════════════════════════════════════════════
// NOTAS DE TODOS LOS ESTUDIANTES · REPORTE PARA PDF
// (se imprime y se guarda como PDF desde el diálogo de impresión)
// ══════════════════════════════════════════════════
let PRINT_REP=false;
function estadoDe(ukey, st, r){
  const nf=notaFinal(ukey,st,r), c=calc(st,r);
  if(nf) return nf.val===null ? 'pend' : (aprueba(nf)?'ok':'no');
  if(c.nota===null || !c.completa) return 'pend';
  return c.nota>=MIN(ukey) ? 'ok' : 'no';
}
const ESTADO={ok:'Aprueba',no:'Reprueba',pend:'Pendiente'};
function construirReporte(){
  const box=$('#print');
  let resumen='', secciones='', TOT={rot:0,est:0,ok:0,no:0,pend:0};
  UNIS.forEach(u=>{
    const recs=DATA[u.key]||{}, fm=u.formato, ros=fm&&fm.tipo==='rosario';
    const ids=Object.keys(recs).sort((a,b)=>String(recs[a].inicio).localeCompare(String(recs[b].inicio)));
    const C={rot:0,est:0,ok:0,no:0,pend:0};
    const bloques=ids.map(id=>{
      const r=recs[id], P=pesos(r);
      const sts=r.estudiantes.filter(st=>(st.nombre||'').trim() || calc(st,r).nota!==null);
      if(!sts.length) return '';
      C.rot++;
      const s=semanas(r.inicio,r.fin);
      let th='<th>#</th><th class="l">Estudiante</th><th class="t">Talleres<small>30%</small></th>';
      if(P.par) th+='<th class="p">Parcial<small>30%</small></th>';
      th+=`<th class="e">Final<small>${P.ex}%</small></th><th class="n">Teórica</th><th class="pr">Práctica</th><th class="co">Conductual</th>`;
      if(ros) th+='<th class="ae">Autoeval.</th>';
      if(fm) th+=`<th class="f">Nota final<small>${es50(fm)?'/50':'/5.0'}</small></th>`;
      th+='<th>Estado</th>';
      const filas=sts.map((st,i)=>{
        const c=calc(st,r), nf=notaFinal(u.key,st,r), e=estadoDe(u.key,st,r);
        C.est++; C[e]++;
        let td=`<td>${i+1}</td><td class="l">${esc(st.nombre||'(sin nombre)')}</td><td>${f2(val(st.tal))}</td>`;
        if(P.par) td+=`<td>${f2(val(st.par))}</td>`;
        td+=`<td>${f2(val(st.ex))}</td><td class="b">${f2(c.nota)}</td><td>${f2(val(st.practica))}</td><td>${f2(val(st.conductual))}</td>`;
        if(ros) td+=`<td>${f2(val(st.autoevaluacion))}</td>`;
        if(fm) td+=`<td class="b ${e}">${nf.val===null?'—':nf.val.toFixed(nf.escala===50?1:2)}</td>`;
        td+=`<td class="st ${e}">${ESTADO[e]}</td>`;
        return `<tr>${td}</tr>`;
      }).join('');
      return `<div class="rb"><div class="rh">${esc(rotLabel(r))}${s?` · ${s} sem`:''} · Periodo ${semestre(r.inicio)}
        <span>Teórica = talleres 30%${P.par?' + parcial 30%':''} + final ${P.ex}%</span></div>
        <table><thead><tr>${th}</tr></thead><tbody>${filas}</tbody></table></div>`;
    }).join('');
    if(!C.rot) return;
    Object.keys(TOT).forEach(k=>TOT[k]+=C[k]);
    const minTxt = fm&&es50(fm) ? '30/50' : MIN(u.key).toFixed(1);
    resumen+=`<tr><td class="l"><i style="background:${u.color}"></i>${u.label}</td><td>${C.rot}</td><td>${C.est}</td>
      <td class="ok">${C.ok}</td><td class="no">${C.no}</td><td>${C.pend}</td><td>${minTxt}</td></tr>`;
    secciones+=`<section class="rs" style="--uc:${u.color}"><h2>${u.label}
      <span>${fm?fm.regla:'Teórica, práctica y conductual (sin formato de nota final)'} · Mínimo ${minTxt}</span></h2>${bloques}</section>`;
  });
  if(!TOT.est){ box.innerHTML=''; return false; }
  box.className='rep';
  box.style.removeProperty('--uc');
  box.innerHTML=`<header class="rt"><div><h1>Notas · Rotación de Anestesiología</h1>
      <div class="meta">Consolidado de todas las universidades · Subred Suroccidente · ${fmtF(hoyISO())}</div></div>
      <div class="kp"><b>${TOT.est}</b>estudiantes<b class="ok">${TOT.ok}</b>aprueban<b class="no">${TOT.no}</b>reprueban<b>${TOT.pend}</b>pendientes</div></header>
    <table class="sum"><thead><tr><th class="l">Universidad</th><th>Rotaciones</th><th>Estudiantes</th><th>Aprueban</th><th>Reprueban</th><th>Pendientes</th><th>Mínimo</th></tr></thead>
      <tbody>${resumen}</tbody></table>
    ${secciones}
    <div class="foot">Dr. Andrés Robayo C. · Coordinador académico de Anestesiología · Subred Suroccidente</div>`;
  return true;
}
function imprimirTodo(){
  if(!construirReporte()){ alert('No hay estudiantes guardados todavía.'); return; }
  PRINT_REP=true; window.print();
}
window.addEventListener('afterprint',()=>{ PRINT_REP=false; });

// ══════════════════════════════════════════════════
// IMPRESIÓN (reporte estático de la rotación abierta)
// ══════════════════════════════════════════════════
function construirImpresion(){
  const r=rot(), box=$('#print');
  if(PRINT_REP) return true;
  if(!r){ box.innerHTML=''; return false; }
  box.className='';
  const u=uniBy(SEL.u), P=pesos(r), ros=u.formato&&u.formato.tipo==='rosario';
  let th='<th style="text-align:left">Estudiante</th><th class="t">Talleres<small>promedio · 30%</small></th>';
  if(P.par) th+='<th class="p">Parcial<small>30%</small></th>';
  th+=`<th class="e">Examen final<small>${P.ex}%</small></th><th class="n">Nota teórica</th><th class="pr">Práctica</th><th class="co">Conductual</th>`;
  if(ros) th+='<th class="ae">Autoevaluación</th>';
  const rows=r.estudiantes.map(st=>{
    const c=calc(st,r), f=v=>f2(val(v));
    let td=`<td class="name">${esc(st.nombre||'—')}</td><td>${f(st.tal)}</td>`;
    if(P.par) td+=`<td>${f(st.par)}</td>`;
    td+=`<td>${f(st.ex)}</td><td><b class="res ${c.nota===null?'':c.nota>=MIN(SEL.u)?'pass':'fail'}">${f2(c.nota)}</b></td><td>${f(st.practica)}</td><td>${f(st.conductual)}</td>`;
    if(ros) td+=`<td>${f(st.autoevaluacion)}</td>`;
    return `<tr>${td}</tr>`;
  }).join('');
  const s=semanas(r.inicio,r.fin);
  box.style.setProperty('--uc',u.color);
  box.innerHTML=`<h1>${u.label} · Anestesiología</h1>
    <div class="meta">Rotación: ${esc(rotLabel(r))}${s?` · ${s} semana${s>1?'s':''}`:''} · Talleres asignados: ${esc(r.talleres.filter(Boolean).join(', ')||'—')}<br>
    Nota teórica = promedio de talleres 30%${P.par?' + parcial 30%':''} + examen final ${P.ex}%</div>
    <table><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table>
    ${formatoHTML(SEL.u,r,true)}
    <div class="foot">Dr. Andrés Robayo C. · Coordinador académico de Anestesiología · Subred Suroccidente · Impreso ${fmtF(hoyISO())}</div>`;
  return true;
}
function imprimir(){ if(construirImpresion()) window.print(); }
window.addEventListener('beforeprint',construirImpresion);

load();
if(SEL.u && !rot()) SEL.r='';
status();
renderAll();
</script>
